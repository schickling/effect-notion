require_version: '>=2.3'
inputs:
  devenv:
    url: github:cachix/devenv/v2.3
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-unstable
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  playwright:
    url: path:nix/playwright-flake
    inputs:
      nixpkgs:
        follows: nixpkgs
  tsgo:
    url: github:Effect-TS/tsgo
    inputs:
      nixpkgs:
        follows: nixpkgs
