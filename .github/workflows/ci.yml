      CI: 'true'
      BUCK2_NO_REMOTE_CACHE: '1'
      GITHUB_TOKEN: ${{ github.token }}
      ARTIFACT_DIR: '${{ github.workspace }}/tmp/devenv-perf-ci'
      OTEL_SERVICE_NAME: devenv-perf-ci
