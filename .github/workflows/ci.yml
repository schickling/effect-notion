                  producer: { name: "effect-utils-ci-measurement", version: 1 },
                  subject: {
                    repo: $repository,
                    branchKind: (if $branchKind == "" then "unknown" else $branchKind end),
                    ref: $ref,
                    headSha: $headSha,
                    baseSha: $baseSha
