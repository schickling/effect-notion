[project]
name = "effect-utils"
revision = "1.0"

[profiles.default]
BUCK2_REMOTE_CACHE_BASIC_AUTH = { description = "Standard Base64 encoding of the dedicated tailnet bazel-remote HTTP Basic-auth username:password credential; the value excludes the \"Basic \" prefix", required = false }
NOTION_API_TOKEN = { description = "Notion integration token for live Notion integration tests", required = false }
NOTION_TEST_PARENT_PAGE_ID = { description = "Dedicated scratch Notion parent page used by live Notion integration tests", required = false }
NOTION_DATASOURCE_SYNC_PARENT_PAGE_ID = { description = "Dedicated scratch Notion parent page for notion-datasource-sync live E2E tests; falls back to NOTION_TEST_PARENT_PAGE_ID when unset", required = false }
NOTION_DATASOURCE_SYNC_E2E_LEDGER_PAGE_ID = { description = "Optional visible Notion ledger page for sanitized notion-datasource-sync live E2E summaries", required = false }
NOTION_DATASOURCE_SYNC_DEMO_PAGE_ID = { description = "Optional durable demo page for the notion-datasource-sync live showcase; used only for explicit demo runs", required = false }
NETLIFY_AUTH_TOKEN = { description = "Netlify token for ci-tools live deploy E2E; optional and only used by the guarded live Netlify test", required = false }
NETLIFY_SITE_ID = { description = "Netlify site id for ci-tools live deploy E2E; optional and not committed into code or records", required = false }
CI_TOOLS_NETLIFY_SITE_NAME = { description = "Optional Netlify site slug for ci-tools live deploy E2E alias URL construction", required = false }
VERCEL_TOKEN = { description = "Vercel token for ci-tools live deploy E2E; optional and only used by the guarded live Vercel test", required = false }
VERCEL_PROJECT_ID = { description = "Vercel project id for ci-tools live deploy E2E; optional and not committed into code or records", required = false }
VERCEL_ORG_ID = { description = "Vercel org id for ci-tools live deploy E2E; optional and not committed into code or records", required = false }
VERCEL_TEAM_ID = { description = "Optional Vercel team id for ci-tools live deploy E2E project lookup and CLI scoping", required = false }
VERCEL_SCOPE = { description = "Optional Vercel CLI scope slug for ci-tools live deploy E2E team projects; stored as a secret so provider account names are not committed", required = false }
VERCEL_AUTOMATION_BYPASS_SECRET = { description = "Vercel Protection Bypass for Automation secret for ci-tools live deploy E2E verification; optional and never emitted in records", required = false }
